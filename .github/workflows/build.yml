name: Build Piskvork
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild source/piskvork.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:OutDir=$env:GITHUB_WORKSPACE\artifact\" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Compile and run CLI parser tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc tests\cli_startup_test.cpp /Fe:cli_startup_test.exe
          if errorlevel 1 exit /b 1
          cli_startup_test.exe
          if errorlevel 1 exit /b 1
      - name: Verify effective settings and registry isolation
        shell: pwsh
        run: ./tests/cli-smoke.ps1 -Executable artifact/piskvork.exe
      - name: Package manager and build provenance
        shell: pwsh
        run: |
          Copy-Item openings.txt,piskvork.txt,README.md -Destination artifact
          Copy-Item language,skins -Destination artifact -Recurse
          $metadata = @{ commit_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; configuration='Release'; architecture='x64'; cli_benchmark_version=1; executable_sha256=(Get-FileHash artifact/piskvork.exe -Algorithm SHA256).Hash.ToLowerInvariant() }
          $metadata | ConvertTo-Json | Set-Content artifact/build.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: piskvork-windows-x64
          path: |
            artifact/piskvork.exe
            artifact/build.json
            artifact/openings.txt
            artifact/piskvork.txt
            artifact/README.md
            artifact/language/
            artifact/skins/
          if-no-files-found: error
          retention-days: 30
